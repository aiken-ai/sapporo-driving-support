name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Prepare GitHub Pages
        shell: bash
        run: |
          set -e

          rm -rf pages
          mkdir -p pages

          echo "===== Build output ====="
          find dist/client -type f | sort
          echo "========================"

          # vinextのclient成果物をPagesのルートへコピー
          if [ -d "dist/client/sapporo-driving-support" ]; then
            cp -R dist/client/sapporo-driving-support/. pages/
          else
            cp -R dist/client/. pages/
          fi

          # publicフォルダの画像などをコピー
          if [ -d "public" ]; then
            cp -Rn public/. pages/ || true
          fi

          # vinext本番サーバーを起動
          nohup pnpm exec vinext start \
            -H 127.0.0.1 \
            -p 3000 \
            > /tmp/vinext.log 2>&1 &

          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo "Waiting for vinext production server..."

          READY=0

          for i in $(seq 1 30); do
            if curl -fsS \
              "http://127.0.0.1:3000/" \
              -o pages/index.html; then
              READY=1
              break
            fi

            sleep 1
          done

          echo "===== vinext log ====="
          cat /tmp/vinext.log || true
          echo "======================"

          if [ "$READY" -ne 1 ]; then
            echo "vinext root request failed"
            exit 1
          fi

          # 各ページをHTMLとして保存
          for route in license paper-driver motorcycle; do
            mkdir -p "pages/$route"

            curl -fsS \
              "http://127.0.0.1:3000/$route/" \
              -o "pages/$route/index.html"
          done

          # 404ページ
          if [ -f "dist/client/404.html" ] && [ ! -f "pages/404.html" ]; then
            cp "dist/client/404.html" "pages/404.html"
          fi

          # Jekyllを無効化
          touch pages/.nojekyll

          echo "===== GitHub Pages artifact ====="
          find pages -type f | sort
          echo "================================="

          # 必須HTMLを確認
          test -s pages/index.html
          test -s pages/license/index.html
          test -s pages/paper-driver/index.html
          test -s pages/motorcycle/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
