name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Prepare GitHub Pages files
        shell: bash
        run: |
          set -e

          echo "===== BUILD OUTPUT ====="
          find dist -maxdepth 5 -type f | sort
          echo "========================"

          rm -rf pages
          mkdir -p pages

          # vinext with basePath generates the site under:
          # dist/client/sapporo-driving-support/
          #
          # The GitHub Pages repository root must have index.html.
          # Therefore copy the generated site and promote the homepage.

          if [ -f "dist/client/sapporo-driving-support/index.html" ]; then
            echo "Found trailing-slash homepage."

            cp -R "dist/client/sapporo-driving-support/." pages/

            mkdir -p pages/sapporo-driving-support
            cp -R "dist/client/sapporo-driving-support/." \
              pages/sapporo-driving-support/

          elif [ -f "dist/client/sapporo-driving-support.html" ]; then
            echo "Found basePath homepage HTML."

            cp -R dist/client/. pages/

            cp "dist/client/sapporo-driving-support.html" \
              pages/index.html

          else
            echo "ERROR: Homepage HTML was not found."
            echo ""
            echo "Generated files:"
            find dist -type f | sort
            exit 1
          fi

          # Make sure the public basePath directory remains available.
          if [ -d "dist/client/sapporo-driving-support" ]; then
            rm -rf pages/sapporo-driving-support
            mkdir -p pages/sapporo-driving-support
            cp -R "dist/client/sapporo-driving-support/." \
              pages/sapporo-driving-support/
          fi

          touch pages/.nojekyll

          echo ""
          echo "===== GITHUB PAGES OUTPUT ====="
          find pages -maxdepth 4 -type f | sort
          echo "================================"

          test -f pages/index.html

          echo ""
          echo "SUCCESS: pages/index.html exists."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
