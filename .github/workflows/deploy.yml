name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Prepare GitHub Pages
        shell: bash
        run: |
          set -e

          rm -rf pages
          mkdir -p pages

          echo "===== Build output ====="
          find dist/client -type f | sort
          echo "========================"

          # vinextの静的ビルド結果をGitHub Pagesのルートへコピー
          if [ -d "dist/client/sapporo-driving-support" ]; then
            cp -R dist/client/sapporo-driving-support/. pages/
          else
            cp -R dist/client/. pages/
          fi

          # publicフォルダの画像などをコピー
          if [ -d "public" ]; then
            cp -Rn public/. pages/ || true
          fi

          # 404ページ
          if [ -f "dist/client/404.html" ] && [ ! -f "pages/404.html" ]; then
            cp "dist/client/404.html" "pages/404.html"
          fi

          # Jekyllを無効化
          touch pages/.nojekyll

          echo "===== GitHub Pages artifact ====="
          find pages -type f | sort
          echo "================================="

          # index.htmlが存在することを確認
          test -s pages/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
