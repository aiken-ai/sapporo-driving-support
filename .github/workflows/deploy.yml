name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Prepare GitHub Pages
        shell: bash
        run: |
          set -e

          rm -rf pages
          mkdir -p pages/sapporo-driving-support

          echo "===== Build output ====="
          find dist/client -type f | sort
          echo "========================"

          if [ -d dist/client/sapporo-driving-support ]; then
            cp -R dist/client/sapporo-driving-support/. pages/sapporo-driving-support/
          fi

          find dist/client -maxdepth 1 -type f \
            -exec cp {} pages/sapporo-driving-support/ \;

          if [ -d public ]; then
            cp -R public/. pages/sapporo-driving-support/
          fi

          nohup pnpm exec vinext start \
            -H 127.0.0.1 \
            -p 3000 \
            > /tmp/vinext.log 2>&1 &

          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for vinext production server..."

          for i in $(seq 1 30); do
            if curl -fsS \
              "http://127.0.0.1:3000/sapporo-driving-support/" \
              -o pages/sapporo-driving-support/index.html; then
              break
            fi
            sleep 1
          done

          echo "===== vinext log ====="
          cat /tmp/vinext.log || true
          echo "======================"

          test -s pages/sapporo-driving-support/index.html

          touch pages/.nojekyll

          echo "===== GitHub Pages ====="
          find pages -type f | sort
          echo "========================"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
