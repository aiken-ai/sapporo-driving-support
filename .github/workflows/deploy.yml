name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm exec vinext build --prerender-all

      - name: Prepare GitHub Pages
        shell: bash
        run: |
          set -e

          rm -rf pages
          mkdir -p pages

          echo "===== Generated HTML ====="
          find dist -type f -name '*.html' | sort || true
          echo "=========================="

          if [ -d "dist/client/sapporo-driving-support" ]; then
            cp -R dist/client/sapporo-driving-support/. pages/
          elif [ -d "dist/client" ]; then
            cp -R dist/client/. pages/
          fi

          if [ -d "public" ]; then
            cp -Rn public/. pages/ || true
          fi

          HTML_FILE=""

          for candidate in \
            "dist/client/sapporo-driving-support/index.html" \
            "dist/server/prerendered-routes/sapporo-driving-support/index.html" \
            "dist/client/index.html" \
            "dist/server/prerendered-routes/index.html"
          do
            if [ -s "$candidate" ]; then
              HTML_FILE="$candidate"
              break
            fi
          done

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: Generated index.html was not found."
            echo "===== dist files ====="
            find dist -type f | sort
            echo "======================"
            exit 1
          fi

          echo "Using homepage HTML: $HTML_FILE"
          cp "$HTML_FILE" pages/index.html

          if [ -d "dist/server/prerendered-routes" ]; then
            while IFS= read -r html; do
              rel="${html#dist/server/prerendered-routes/}"

              case "$rel" in
                sapporo-driving-support/*)
                  rel="${rel#sapporo-driving-support/}"
                  mkdir -p "pages/$(dirname "$rel")"
                  cp "$html" "pages/$rel"
                  ;;
              esac
            done < <(
              find dist/server/prerendered-routes \
                -type f \
                -name '*.html' \
                | sort
            )
          fi

          if [ -f "dist/client/404.html" ] && [ ! -f "pages/404.html" ]; then
            cp "dist/client/404.html" "pages/404.html"
          fi

          touch pages/.nojekyll

          echo "===== GitHub Pages artifact ====="
          find pages -type f | sort
          echo "================================="

          test -s pages/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
